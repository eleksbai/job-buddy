[project]
name = "job-buddy"
version = "0.1.0"
description = "Local job hunting assistant with FastAPI, FastMCP, and MongoDB."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boss-agent-cli>=1.11.0",
    "fastapi>=0.115.0",
    "fastmcp>=3.2.4",
    "motor>=3.7.1",
    "pydantic-settings>=2.9.1",
    "pymongo>=4.13.0",
    "pytest>=9.0.3",
    "python-dotenv>=1.1.0",
    "python-multipart>=0.0.20",
    "uvicorn>=0.34.2",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3.5",
    "pytest-asyncio>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_buddy"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
