[project]
name = "job-buddy"
version = "0.1.0"
description = "Local job hunting assistant with FastAPI, FastMCP, and MongoDB."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "fastmcp>=3.2.4",
    "motor>=3.7.1",
    "patchright>=1.59.1",
    "pydantic-settings>=2.9.1",
    "pymongo>=4.13.0",
    "python-dotenv>=1.1.0",
    "openai>=1.0.0",
    "python-multipart>=0.0.20",
    "uvicorn>=0.34.2",
]

[project.scripts]
job-buddy-mcp = "job_buddy_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_buddy", "src/job_buddy_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src", "mcp"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipython>=9.13.0",
    "mitmproxy>=11.0.2",
    "pre-commit>=4.2.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.0.0",
]
